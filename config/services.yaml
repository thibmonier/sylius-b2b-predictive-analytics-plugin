services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Tmonier\SyliusPredictiveAnalyticsPlugin\:
        resource: '../src/*'
        exclude: '../src/{Entity,Migrations,TmonierSyliusPredictiveAnalyticsPlugin.php}'

    Tmonier\SyliusPredictiveAnalyticsPlugin\Calculator\Dbal\DbalPredictiveReorderCalculator:
        arguments:
            $countedOrderSql: '@tmonier_company_insights.sql.counted_order'
            $variantRepository: '@sylius.repository.product_variant'

    Tmonier\SyliusPredictiveAnalyticsPlugin\Calculator\MedianQuantityCalculator:
        arguments:
            $countedOrderSql: '@tmonier_company_insights.sql.counted_order'

    # Alias interface -> implémentation
    Tmonier\SyliusPredictiveAnalyticsPlugin\Calculator\PredictiveReorderCalculatorInterface:
        alias: Tmonier\SyliusPredictiveAnalyticsPlugin\Calculator\Dbal\DbalPredictiveReorderCalculator
        public: true

    # Injection du repository Company pour la commande
    Tmonier\SyliusPredictiveAnalyticsPlugin\Command\RecalculatePredictionsCommand:
        arguments:
            $companyRepository: '@tmonier_company_accounts.repository.company'

    # Contrôleur PrepareCart : injection des services Sylius par leurs IDs
    Tmonier\SyliusPredictiveAnalyticsPlugin\Controller\Shop\PrepareCartController:
        public: true
        tags: ['controller.service_arguments']
        arguments:
            $cartContext: '@sylius.context.cart'
            $channelRepository: '@sylius.repository.channel'
            $customerRepository: '@sylius.repository.customer'
            $orderItemFactory: '@sylius.factory.order_item'
            $orderItemQuantityModifier: '@sylius.modifier.order_item_quantity'
            $orderModifier: '@sylius.modifier.order'
            $entityManager: '@sylius.manager.order'

    # Contrôleur DismissPrediction : injection des services Sylius et de l'horloge
    Tmonier\SyliusPredictiveAnalyticsPlugin\Controller\Shop\DismissPredictionController:
        public: true
        tags: ['controller.service_arguments']
        arguments:
            $variantRepository: '@sylius.repository.product_variant'
            $clock: '@clock'

    # Attrition : historique des commandes et horloge
    Tmonier\SyliusPredictiveAnalyticsPlugin\Attrition\CompanyOrderHistoryInterface:
        alias: Tmonier\SyliusPredictiveAnalyticsPlugin\Attrition\Dbal\DbalCompanyOrderHistory

    Tmonier\SyliusPredictiveAnalyticsPlugin\Attrition\Dbal\DbalCompanyOrderHistory:
        arguments:
            $countedOrderSql: '@tmonier_company_insights.sql.counted_order'

    # Permission de lecture des entreprises : contrôle d'autorisation des ressources Sylius
    Tmonier\SyliusPredictiveAnalyticsPlugin\Security\CompanyReadPermission:
        arguments:
            $authorizationChecker: '@sylius.resource_controller.authorization_checker'
            $registry: '@sylius.resource_registry'

    # Filtre « rythme de commande » de la liste des entreprises
    Tmonier\SyliusPredictiveAnalyticsPlugin\Grid\AttritionFilter:
        tags:
            - { name: sylius.grid_filter, type: tmonier_predictive_attrition, form_type: Sylius\Bundle\GridBundle\Form\Type\Filter\SelectFilterType }
