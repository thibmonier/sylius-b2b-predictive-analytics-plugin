tmonier_predictive_shop_prepare_cart:
    path: /predictive/prepare-cart/{variantId}
    methods: [POST]
    defaults:
        _controller: Tmonier\SyliusPredictiveAnalyticsPlugin\Controller\Shop\PrepareCartController
    requirements:
        variantId: \d+

tmonier_predictive_shop_dismiss:
    path: /predictive/dismiss/{variantId}/{type}
    methods: [POST]
    defaults:
        _controller: Tmonier\SyliusPredictiveAnalyticsPlugin\Controller\Shop\DismissPredictionController
    requirements:
        variantId: \d+
        type: never|later
